[package]
name = "panaseeya-cli"
description = "Command-line interface to the Panaseeya game catalog."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "panaseeya"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.9", features = ["derive"] }
directories = "6.0.0"
panaseeya-core = { path = "../panaseeya-core" }
serde_json = "1.0.154"

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
tempfile = "3.27.0"
